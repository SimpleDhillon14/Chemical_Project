<div id="loadingSpinner" class="loading-spinner">
  <div class="spinner-border" role="status"></div>
  <p class="mt-2">Running analysis…</p>
</div>

<div id="resultsWrapper" style="display:none;">

  <div class="panel">
    <h4>1. Input Data</h4>
    <div id="inputDataTable"></div>
  </div>

  <div class="panel">
    <h4>2. Selected Method</h4>
    <p id="selectedMethodText" class="fw-bold"></p>
    <h4 class="mt-4">3. Original Kinetic Equation</h4>
    <div class="equation-box" id="originalEquation"></div>
  </div>

  <div class="panel">
    <h4>4 &amp; 5. Data Transformation</h4>
    <div id="transformedTable"></div>
  </div>

  <div class="panel">
    <h4>6. Graphical Analysis</h4>
    <div id="mainGraph" class="plot-container"></div>
    <div id="extraGraphs"></div>
  </div>

  <div class="panel">
    <h4>7. Step-by-Step Interpretation</h4>
    <div id="stepsContainer"></div>
  </div>

  <div class="panel">
    <h4>8. Final Results</h4>
    <div class="row" id="resultCards"></div>
  </div>

  <div class="panel">
    <h4>Prediction Calculator</h4>
    <p class="text-muted">Use the fitted kinetic equation to predict concentration, time, or rate.</p>
    <div class="row g-3 align-items-end">
      <div class="col-md-4">
        <label class="form-label">Calculate</label>
        <select id="predictMode" class="form-select">
          <option value="concentration">Concentration at a given time</option>
          <option value="time">Time to reach a given concentration</option>
          <option value="rate">Rate at a given concentration</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label" id="predictInputLabel">Input value</label>
        <input type="number" step="any" class="form-control" id="predictInput" placeholder="e.g. 50">
      </div>
      <div class="col-md-4">
        <button class="btn btn-gold w-100" onclick="runPrediction()">Predict</button>
      </div>
    </div>
    <div id="predictResult" class="mt-3"></div>
  </div>

</div>
